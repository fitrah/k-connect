name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: k_connect_test
      DB_USERNAME: k_connect
      DB_PASSWORD: k_connect
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    services:
      postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_DB: k_connect_test
          POSTGRES_USER: k_connect
          POSTGRES_PASSWORD: k_connect
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U k_connect -d k_connect_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks scanner
        shell: bash
        run: |
          set -euo pipefail
          version='8.30.1'
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" -o "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks

      - name: Verify Gitleaks controlled historical negative
        run: tests/ci/gitleaks-history-test.sh

      - name: Scan complete Git history for secrets
        run: gitleaks git --no-banner --redact --log-opts='--all' .

      - name: Verify CI actions are commit-pinned
        run: scripts/check-pinned-actions.sh

      - name: Verify CI action pinning controlled negatives
        run: tests/ci/pinned-actions-test.sh

      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql
          coverage: none

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate Composer metadata and lockfile
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit PHP dependencies
        run: composer audit --locked

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build frontend assets
        run: npm run build

      - name: Reject tracked secrets and generated artifacts
        run: scripts/check-repository-hygiene.sh

      - name: Verify repository hygiene controlled negatives
        run: tests/ci/repository-hygiene-test.sh

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run static analysis
        run: timeout 180s composer analyse

      - name: Verify PostgreSQL migrate, repeat seed, rollback, and reapply
        run: |
          php artisan migrate:fresh --seed --force
          php artisan db:seed --force
          php artisan migrate:rollback --force
          php artisan migrate --force

      - name: Run complete PostgreSQL-backed test suite
        run: php artisan test --compact
